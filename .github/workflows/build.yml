name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: 构建与测试 (macOS)
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          swift --version
          xcodebuild -version

      - name: 单元测试
        run: swift test

      - name: 打包 .app
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh release

      - name: 应用自检（跑打包后的真实二进制）
        run: |
          BIN="dist/滑洲云图.app/Contents/MacOS/HuazhouMap"
          ("$BIN" --self-test > selftest.log 2>&1; echo $? > selftest.code) &
          PID=$!
          for i in $(seq 1 90); do
            [ -f selftest.code ] && break
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          cat selftest.log
          test -f selftest.code || { echo "自检未在 90 秒内结束"; exit 1; }
          test "$(cat selftest.code)" = "0"

      - name: 校验产物
        run: |
          test -d "dist/滑洲云图.app" || exit 1
          plutil -lint "dist/滑洲云图.app/Contents/Info.plist"
          ls -lh dist/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HuazhouMap-macOS
          path: dist/HuazhouMap-macOS.zip
          if-no-files-found: error
